name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL" || { echo "Add the APP_URL repository variable first"; exit 1; }
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 "${APP_URL%/}/healthz"
